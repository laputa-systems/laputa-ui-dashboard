<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Static forms fixture</title><link rel="stylesheet" href="/dist/styles.css"><link rel="stylesheet" href="/dist/styles/forms.css"></head>
  <body>
    <form action="/search" method="get">
      <div class="ui-field">
        <label class="ui-field-label" for="query">Query</label>
        <input class="ui-text-field" id="query" name="query" aria-describedby="query-hint" required>
        <div class="ui-field-hint" id="query-hint">Search repositories</div>
      </div>
      <button type="submit">Search</button>
    </form>
  </body>
</html>
