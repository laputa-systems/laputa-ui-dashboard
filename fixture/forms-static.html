<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Static forms fixture</title><link rel="stylesheet" href="/dist/styles.css"><link rel="stylesheet" href="/dist/styles/forms.css"><link rel="stylesheet" href="/dist/styles/feedback.css"><link rel="stylesheet" href="/dist/styles/layout.css"></head>
  <body>
    <form action="/attach" method="get"><label class="ui-field ui-file-field" for="static-file"><span class="ui-field-label">Static attachment</span><input id="static-file" name="attachment" type="file" accept=".txt" required></label><button type="submit">Attach file</button></form>
    <form action="/dates" method="get"><label class="ui-field" for="static-start"><span class="ui-field-label">Static start date</span><input class="ui-text-field" id="static-start" type="date" name="start" min="2024-02-01" max="2024-03-31" required></label><label class="ui-field" for="static-end"><span class="ui-field-label">Static end date</span><input class="ui-text-field" id="static-end" type="date" name="end" min="2024-02-01" max="2024-03-31" required></label><button type="submit">Choose dates</button></form>
    <form action="/choose-many" method="get"><label for="static-multi">Static multiple choice</label><select id="static-multi" name="projects" multiple><option value="alpha">Alpha</option><option value="gamma">Gamma</option></select><button type="submit">Choose many</button></form>
    <form action="/choose" method="get"><label for="static-choice">Static choice</label><select id="static-choice" name="project"><optgroup label="Projects"><option value="alpha">Alpha</option><option value="gamma">Gamma</option></optgroup></select><button type="submit">Choose</button></form>
    <label class="ui-choice ui-choice-card" for="static-check"><input class="ui-checkbox" id="static-check" type="checkbox" name="static-check"><span class="ui-choice-content"><span class="ui-field-label">Static checkbox</span></span></label>
    <form id="retry-form" action="/retry" method="get"><div class="ui-action-status"><span class="ui-action-status-error" role="alert">Save failed</span><button class="ui-btn ui-btn-small" type="submit">Retry request</button></div></form>
    <div class="ui-accordion"><details class="ui-disclosure" name="static-accordion"><summary class="ui-disclosure-summary">Static first</summary><div class="ui-disclosure-body">Static first content</div></details><details class="ui-disclosure" name="static-accordion"><summary class="ui-disclosure-summary">Static second</summary><div class="ui-disclosure-body">Static second content</div></details></div>
    <details class="ui-disclosure"><summary class="ui-disclosure-summary">Static detail</summary><div class="ui-disclosure-body">Static content</div></details>
    <label class="ui-progress"><span class="ui-progress-label">Upload</span><progress class="ui-progress-bar" value="5" max="10"></progress></label>
    <form action="/search" method="get">
      <div class="ui-field">
        <label class="ui-field-label" for="query">Query</label>
        <input class="ui-text-field" id="query" name="query" aria-describedby="query-hint" required>
        <div class="ui-field-hint" id="query-hint">Search repositories</div>
      </div>
      <button type="submit">Search</button>
    </form>
  </body>
</html>
